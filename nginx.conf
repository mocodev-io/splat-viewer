server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/javascript text/css application/json application/octet-stream;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # ES modules need a JavaScript MIME type; the stock table has no .mjs
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    # the app asks these folders for their contents as JSON
    location /splats/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    location /luts/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
