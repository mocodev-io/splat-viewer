server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json application/octet-stream;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # hashed build output never changes under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the mounted splats (and their settings .json); listed as JSON for the app
    location /splats/ {
        alias /splats/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
