server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json application/octet-stream;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # hashed build output never changes under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the mounted splats; listed as JSON for the app
    location /splats/ {
        alias /splats/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # the mounted settings folder: listed as JSON for the app, which saves
    # settings into it with PUT, .json files directly in the folder only
    location /settings/ {
        root /;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";

        location ~ ^/settings/[^/]+\.json$ {
            root /;
            dav_methods PUT;
            dav_access user:rw group:rw all:r;
            client_max_body_size 1m;
            add_header Cache-Control "no-cache";
        }
    }
}
