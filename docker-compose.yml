services:
  splat-viewer:
    image: ghcr.io/mocodev-io/splat-viewer:latest
    container_name: splat-viewer
    ports:
      - "8096:80"
    volumes:
      # .ply / .sog files, SOG / LOD folders
      - /mnt/user/appdata/splat-viewer/splats:/splats:ro
      # saved settings (.json); writable for the container's nginx user (uid 101)
      - /mnt/user/appdata/splat-viewer/settings:/settings
    restart: unless-stopped
