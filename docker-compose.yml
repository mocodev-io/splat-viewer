services:
  splat-viewer:
    image: ghcr.io/mocodev-io/splat-viewer:latest
    container_name: splat-viewer
    ports:
      - "8096:80"
    volumes:
      # .ply / .sog files, SOG / LOD folders, and optional <name>.json scene settings
      - /mnt/user/appdata/splat-viewer/splats:/splats:ro
    restart: unless-stopped
