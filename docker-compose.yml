services:
  splat-viewer:
    image: ghcr.io/mocodev-io/splat-viewer:latest
    container_name: splat-viewer
    ports:
      - "8096:80"
    volumes:
      # folder with your .ply / .sog files (and SOG / LOD folders)
      - /mnt/user/appdata/splat-viewer/splats:/splats:ro
      # optional: your own .cube / PNG-strip LUTs
      - /mnt/user/appdata/splat-viewer/luts:/luts:ro
    restart: unless-stopped
